# Cloud Workflows: workflow-comunicaciones (us-west1, proyecto automatizaciones-ia-20260420).
# Igual que workflow-documento, pero con un prompt extenso fijo para comunicación estratégica
# y un solo destinatario. Se programa lunes a viernes a las 6 p. m. (America/Bogota).
# Desplegar: gcloud workflows deploy workflow-comunicaciones --location=us-west1 --source=workflow-comunicaciones.yaml
# Entrada opcional: {"email": "...", "paginas": 3, "prompt": "..."} (sin entrada usa los valores de abajo).
main:
  params: [input]
  steps:
    - inicializar_variables:
        assign:
          - proyecto: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - numero_proyecto: ${sys.get_env("GOOGLE_CLOUD_PROJECT_NUMBER")}
          - correo_destino: ${default(map.get(input, "email"), "btoro@enersinc.com")}
          # Literal YAML (no es expresión), así no aplica el límite de 400 caracteres por expresión.
          - prompt_comunicaciones: >-
              Informe diario para la comunicadora estratégica de una consultora y proveedora de tecnología energética en Colombia.
              No basta con resumir noticias; el objetivo es anticipar cómo la regulación, la operación técnica del sistema y los dolores del mercado abren oportunidades de contenido y de negocio para servicios de consultoría, analítica y soluciones tecnológicas.
              Prioriza lo publicado en las últimas 24 a 72 horas y descarta lo que no sea reciente.
              Busca obligatoriamente en estas fuentes y di de cuál sale cada dato.
              Fuentes regulatorias e institucionales, primer nivel de datos, son las entidades que dictan las reglas técnicas, de mercado y de planeación.
              CREG (creg.gov.co), Comisión de Regulación de Energía y Gas, proyectos de resolución, resoluciones, circulares y audiencias, imprescindible para cambios en tarifas, esquemas de confiabilidad, agregación de demanda, respuesta de la demanda, almacenamiento, medición inteligente o remuneración de redes.
              XM (xm.com.co), operador del SIN y administrador del mercado, reportes diarios de embalses, precio de bolsa, demanda, aportes hídricos, limitaciones de transmisión y comunicados operativos, con cifras reales aptas para infografías o análisis.
              UPME (upme.gov.co), Unidad de Planeación Minero Energética, planes de expansión de generación y transmisión, atlas de recursos solar y eólico y convocatorias de infraestructura.
              Ministerio de Minas y Energía (minenergia.gov.co) y Superservicios (superservicios.gov.co), políticas públicas, directrices de transición energética justa y vigilancia del cumplimiento normativo de distribuidoras y comercializadoras.
              Medios económicos y especializados, Diario La República (secciones Economía y Empresas), Portafolio, Valora Analitik, Energía Estratégica Latam y BNamericas, que cubren cierres financieros, subastas, inversiones corporativas y debates de coyuntura energética.
              Gremios de generación y transmisión, ACOLGEN (generadores) y Andeg (térmicas y respaldo), que analizan seguridad de suministro, confiabilidad del parque de generación e hidroclimatología.
              Gremios de distribución y mercado, ASOCODIS (distribuidoras y comercializadoras) y Andesco (servicios públicos), clave para medición inteligente AMI, calidad del servicio, pérdidas no técnicas y tarifas.
              Renovables y nuevas tecnologías, SER Colombia (Asociación de Energías Renovables), con foco en FNCER solar y eólica, almacenamiento con baterías BESS, microrredes e integración a la red.
              Gas, Naturgas, sobre el gas natural como combustible de transición y respaldo termoeléctrico.
              Perfiles clave de LinkedIn, revisa sus publicaciones y declaraciones públicas recientes (LinkedIn, entrevistas, columnas o eventos) y resume lo que dijeron.
              Presidentes y voceros de ACOLGEN, ASOCODIS y SER Colombia, que fijan la agenda del debate técnico y regulatorio frente al Gobierno Nacional.
              Luz Stella Murgas, presidenta de Naturgas, referente en el balance entre gas natural como combustible de transición y respaldo termoeléctrico.
              Directivos y gerentes de regulación de XM y UPME, que suelen compartir análisis breves y gráficos de demanda, estrés del sistema y avances de proyectos antes de los comunicados extensos.
              Exministros y exviceministros de Minas y Energía como Tomás González, Germán Arce y Diego Mesa, con visión macroeconómica y análisis crítico de política pública.
              Directores y analistas de firmas de consultoría energética como SER Ingenergía, Quantum y Phinance, que comparten análisis de precios de bolsa, riesgos contractuales y balances de oferta y demanda.
              Líderes de innovación y digitalización de Enel Colombia, EPM, Celsia e ISA, que publican sobre pilotos de automatización de subestaciones, gemelos digitales, redes inteligentes y ciberseguridad industrial.
              No inventes citas ni publicaciones; si no encuentras nada reciente de una persona, no la menciones.
              Estructura del informe.
              Primero, lo más importante del día en tres a cinco viñetas con cifra, fecha y fuente.
              Segundo, para cada noticia relevante explica qué pasó, a quién impacta y qué oportunidad abre para la empresa.
              Aplica este enfoque editorial.
              De contingencia a solución técnica, si hay volatilidad en el precio de bolsa o estrés hídrico, no te limites a la cifra y conecta con cómo la analítica predictiva o los sistemas de gestión energética EMS reducen la exposición al riesgo de grandes consumidores.
              De cambio regulatorio a consultoría, si la CREG publica un proyecto normativo, propón un video pedagógico corto en cuatro momentos, qué cambia, a quién impacta, qué brechas tecnológicas exige resolver y cómo puede ayudar la empresa.
              De reto operativo a caso de uso, si se discuten pérdidas técnicas o demoras en conexiones de renovables, propón contenido de lecciones aprendidas y buenas prácticas en estudios de conexión y digitalización de redes de distribución.
              Tercero, qué dicen las voces del sector, con lo más relevante que publicaron o declararon los perfiles clave, indicando quién, dónde y cuándo.
              Cuarto, una agenda de contenidos con tres ideas de video para LinkedIn, todas en formato de video corto de 30 a 90 segundos, cada una con titular sugerido, gancho de los primeros 5 segundos, guion breve por escenas o momentos, apoyo visual sugerido (gráfica de datos, animación, vocero a cámara o grabación en campo), dato de respaldo con su fuente y mensaje clave o llamado a la acción.
              Quinto, fechas próximas a vigilar como audiencias, plazos de comentarios, subastas o publicaciones esperadas.
              Usa lenguaje claro y profesional, sin tecnicismos innecesarios, y cita siempre la fuente de cada dato.
          - prompt_busqueda: ${default(map.get(input, "prompt"), prompt_comunicaciones)}
          - tipo_informe: ${default(map.get(input, "tipo"), "general")}
          - paginas: ${string(default(map.get(input, "paginas"), 3))}
          - api_builds: ${"https://cloudbuild.googleapis.com/v1/projects/" + proyecto + "/builds"}
          - secretos: ${"projects/" + proyecto + "/secrets/"}

    - lanzar_build:
        call: http.post
        args:
          url: ${api_builds}
          auth:
            type: OAuth2
          body:
            timeout: "900s"
            serviceAccount: ${"projects/" + proyecto + "/serviceAccounts/" + numero_proyecto + "-compute@developer.gserviceaccount.com"}
            options:
              logging: CLOUD_LOGGING_ONLY
            availableSecrets:
              secretManager:
                - versionName: ${secretos + "api-gateway-datos-url/versions/latest"}
                  env: API_GATEWAY_DATOS_URL
                - versionName: ${secretos + "api-gateway-datos-key/versions/latest"}
                  env: API_GATEWAY_DATOS_KEY
                - versionName: ${secretos + "gcp-sa-json/versions/latest"}
                  env: GCP_SA_JSON
            steps:
              - name: gcr.io/cloud-builders/git
                args: ["clone", "--depth", "1", "--branch", "main", "https://github.com/btoro-enersinc/DocumentacionPDF.git", "src"]
              - name: python:3.12-slim
                dir: src
                secretEnv:
                  - API_GATEWAY_DATOS_URL
                  - API_GATEWAY_DATOS_KEY
                  - GCP_SA_JSON
                env:
                  - AGENT_BACKEND=ces
                  - EMAIL_SENDER=contacto@enersinc.com
                  - PYTHONUNBUFFERED=1
                  - FAST_REPORT=1
                  - OCULTAR_PROMPT=1
                  - BUSQUEDAS_EXTRA=general,linkedin
                  - GROUNDED_MODEL=gemini-2.5-flash
                  - MAX_FUENTES_EVIDENCIA=16
                  - MAX_FUENTES_INFORME=8
                  - ${"PROMPT=" + prompt_busqueda}
                  - ${"EMAIL=" + correo_destino}
                  - ${"PAGINAS=" + paginas}
                  - ${"TIPO_INFORME=" + tipo_informe}
                script: |
                  #!/usr/bin/env bash
                  set -euo pipefail
                  printf '%s' "$GCP_SA_JSON" > /tmp/gcp.json
                  export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp.json
                  export GOOGLE_CLOUD_PROJECT=automatizaciones-ia-20260420
                  pip install -q --root-user-action=ignore --disable-pip-version-check -r requirements.txt
                  case "$PAGINAS" in
                    ''|*[!0-9]*) PAGINAS=2 ;;
                  esac
                  if [ "$PAGINAS" -lt 2 ]; then PAGINAS=2; fi
                  python generar_reporte_local.py \
                    --pregunta "$PROMPT" \
                    --correo "$EMAIL" \
                    --max-pages "$PAGINAS"
        result: lanzado

    - guardar_id:
        assign:
          - build_id: ${lanzado.body.metadata.build.id}

    - esperar:
        call: sys.sleep
        args:
          seconds: 10

    - consultar:
        call: http.get
        args:
          url: ${api_builds + "/" + build_id}
          auth:
            type: OAuth2
        result: estado

    - revisar:
        switch:
          - condition: ${estado.body.status == "SUCCESS"}
            next: responder
          - condition: ${estado.body.status in ["FAILURE", "INTERNAL_ERROR", "TIMEOUT", "CANCELLED", "EXPIRED"]}
            raise:
              mensaje: ${"El build terminó en " + estado.body.status}
              build: ${build_id}
              log: ${estado.body.logUrl}
        next: esperar

    - responder:
        return:
          estado: "Informe enviado"
          correo: ${correo_destino}
          paginas: ${paginas}
          build: ${build_id}
          log: ${estado.body.logUrl}

# Programación (lunes a viernes, 6 p. m. hora Colombia):
# gcloud scheduler jobs create http informe-comunicaciones-18h --location=us-west1 \
#   --schedule="0 18 * * 1-5" --time-zone="America/Bogota" \
#   --uri="https://workflowexecutions.googleapis.com/v1/projects/automatizaciones-ia-20260420/locations/us-west1/workflows/workflow-comunicaciones/executions" \
#   --http-method=POST --message-body='{"argument": "{}"}' \
#   --oauth-service-account-email=<NUMERO_PROYECTO>-compute@developer.gserviceaccount.com
